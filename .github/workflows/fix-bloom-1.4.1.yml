name: Apply Bloom 1.4.1 fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bloom-1.4.1.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply calendar completion fix
        run: python scripts/fix_calendar_completed_141.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartik-todo/app/src/main/java/com/kartik/bloom/MainActivity.kt
          git diff --cached --check
          git commit -m "Keep completed Bloom tasks visible in Calendar"
          git push
