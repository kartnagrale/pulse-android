name: Apply Bloom 1.4.1 fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bloom-1.4.1.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: python scripts/fix_bloom_141.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartik-todo .github/workflows/build-bloom-apk.yml .github/workflows/build-bloom-release.yml
          git diff --cached --check
          git commit -m "Fix Bloom 1.4.1 Today UI and Kynure Labs support"
          git push
