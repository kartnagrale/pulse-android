name: Build Bloom Play AAB

on:
  push:
    branches: [main]
    paths:
      - 'samruddhi-todo/**'
      - '.github/workflows/build-bloom-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samruddhi-todo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release Android App Bundle
        run: gradle bundleRelease --stacktrace

      - name: Copy Play bundle
        run: cp app/build/outputs/bundle/release/app-release.aab ../Bloom-1.0.0-unsigned.aab

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-1.0.0-unsigned-AAB
          path: Bloom-1.0.0-unsigned.aab
          if-no-files-found: error
