name: Build Bloom Play AAB

on:
  push:
    branches: [main]
    paths:
      - 'kartik-todo/**'
      - '.github/workflows/build-bloom-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kartik-todo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release Android App Bundle
        run: gradle bundleRelease --stacktrace

      - name: Copy unsigned validation bundle
        if: ${{ github.event_name == 'push' }}
        run: cp app/build/outputs/bundle/release/app-release.aab ../Bloom-1.1.0-unsigned.aab

      - name: Upload unsigned validation AAB
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-1.1.0-unsigned-AAB
          path: Bloom-1.1.0-unsigned.aab
          if-no-files-found: error

      - name: Validate signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          KS: ${{ secrets.BLOOM_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.BLOOM_UPLOAD_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.BLOOM_UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.BLOOM_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KS" || (echo "Missing BLOOM_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$SP" || (echo "Missing BLOOM_UPLOAD_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KA" || (echo "Missing BLOOM_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KP" || (echo "Missing BLOOM_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BLOOM_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BLOOM_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$BLOOM_UPLOAD_KEYSTORE_BASE64" | base64 --decode > bloom-upload-key.jks

      - name: Sign Android App Bundle
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          STORE_PASSWORD: ${{ secrets.BLOOM_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOOM_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLOOM_UPLOAD_KEY_PASSWORD }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab ../Bloom-1.1.0.aab
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore bloom-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            ../Bloom-1.1.0.aab \
            "$KEY_ALIAS"
          jarsigner -verify ../Bloom-1.1.0.aab

      - name: Upload signed Play AAB
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-1.1.0-Play-AAB
          path: Bloom-1.1.0.aab
          if-no-files-found: error
