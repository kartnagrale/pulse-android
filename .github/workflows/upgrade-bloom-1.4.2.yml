name: Apply Bloom 1.4.2 occurrence upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_today_occurrences_142.py'
      - '.github/workflows/upgrade-bloom-1.4.2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply occurrence model upgrade
        run: python scripts/upgrade_today_occurrences_142.py
      - name: Bump debug version to 1.4.2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kartik-todo/app/build.gradle.kts')
          s=p.read_text().replace('versionCode = 6','versionCode = 7').replace('versionName = "1.4.1"','versionName = "1.4.2"')
          p.write_text(s)
          PY
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartik-todo/app/src/main/java/com/kartik/bloom/MainActivity.kt kartik-todo/app/src/main/java/com/kartik/bloom/TaskStore.kt kartik-todo/app/build.gradle.kts
          git diff --cached --check
          git commit -m "Model Bloom recurring tasks as daily occurrences"
          git push
