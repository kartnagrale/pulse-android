name: Build Bloom APK

on:
  push:
    branches: [ main ]
    paths:
      - 'kartik-todo/**'
      - '.github/workflows/build-bloom-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kartik-todo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Bloom debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Bloom-KynureLabs-v1.4.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-KynureLabs-v1.4.1-APK
          path: Bloom-KynureLabs-v1.4.1.apk
          if-no-files-found: error
